---
# Blue-Green Deployment Values
# Usage:
#   Blue: helm upgrade --install nexvion-blue ./helm/ecommerce
#     -n nexvion --create-namespace
#     -f values-blue.yaml -f values-bluegreen.yaml
#   Green: helm upgrade --install nexvion-green ./helm/ecommerce
#     -n nexvion --create-namespace
#     -f values-green.yaml -f values-bluegreen.yaml
# Switch traffic via ALB listener rules or Ingress annotations

global:
  imageRegistry: ""
  imagePullSecrets: []
  environment: production
  # Blue-Green specific
  deploymentColor: "blue"  # or "green"

frontend:
  enabled: true
  replicaCount: 3
  image:
    repository: nexvion-frontend
    tag: "blue"  # or "green"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: true
    className: alb
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
      # For Blue-Green, use listener rules on ALB to switch traffic
      # alb.ingress.kubernetes.io/actions.ssl-redirect: >
      #   {"Type": "redirect", "RedirectConfig":
      #    { "Protocol": "HTTPS", "Port": "443", "StatusCode": "HTTP_301"}}
    hosts:
      - host: nexvion.ghanshyam.site
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: nexvion-tls
        hosts:
          - nexvion.ghanshyam.site
  resources:
    limits:
      cpu: 1000m
      memory: 256Mi
    requests:
      cpu: 250m
      memory: 128Mi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

backend:
  enabled: true
  replicaCount: 3
  image:
    repository: nexvion-backend
    tag: "blue"  # or "green"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  resources:
    limits:
      cpu: 2000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  env:
    DEBUG: "false"
  envFrom:
    - secretRef:
        name: nexvion-secrets

# Traffic switching via ALB listener rules
# For Blue:
#   alb.ingress.kubernetes.io/listener-rules: |
#     - priority: 100
#       conditions:
#         - host: nexvion.ghanshyam.site
#       actions:
#         - type: forward
#           targetGroup: nexvion-blue-frontend-tg
# For Green:
#   alb.ingress.kubernetes.io/listener-rules: |
#     - priority: 100
#       conditions:
#         - host: nexvion.ghanshyam.site
#       actions:
#         - type: forward
#           targetGroup: nexvion-green-frontend-tg
