# SonarQube Project Configuration for nexvion-backend
# Used by sonar-scanner in Jenkins pipeline

# Project identification
sonar.projectKey=nexvion-backend
# sonar.organization=nexvion-github  # Only for SonarCloud - comment out for self-hosted SonarQube

# Project metadata
sonar.projectName=Nexvion Backend
sonar.projectVersion=1.0.0

# Source code
sonar.sources=app
sonar.tests=tests
sonar.exclusions=**/__pycache__/**,**/migrations/**,**/alembic/**

# Python specific
sonar.language=py
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml

# Test execution
sonar.python.pytest.reportsPath=test-results/

# Quality gate
sonar.qualitygate.wait=true

# Encoding
sonar.sourceEncoding=UTF-8

# Exclude virtual environments and build artifacts
sonar.exclusions=**/venv/**,**/.venv/**,**/__pycache__/**,**/dist/**,**/build/**,**/*.egg-info/**,**/.pytest_cache/**,**/.mypy_cache/**,**/.ruff_cache/**

# Duplication detection
sonar.cpd.exclusions=**/tests/**/*.py

# Branch analysis (for PR analysis)
# sonar.pullrequest.base=main
# sonar.pullrequest.key=${CHANGE_ID}
# sonar.pullrequest.branch=${CHANGE_BRANCH}