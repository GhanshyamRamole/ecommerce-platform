[project]
name = "nexvion-backend"
version = "0.1.0"
description = "Nexvion E-Commerce Backend API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "sqlalchemy==2.0.36",
    "asyncpg==0.29.0",
    "pydantic[email]==2.10.0",
    "pydantic-settings==2.5.0",
    "alembic==1.13.2",
    "python-dotenv==1.0.1",
    "python-multipart==0.0.12",
]

[project.optional-dependencies]
dev = [
    "httpx==0.27.2",
    "pytest==8.3.4",
    "pytest-asyncio==0.23.8",
    "pytest-cov==5.0.0",
    "ruff==0.6.9",
    "mypy==1.13.0",
    "testcontainers==4.7.0",
    "psycopg2-binary==2.9.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "dist", "build", "__pycache__", ".mypy_cache", ".ruff_cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "T20"]
ignore = ["E501", "S101", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict_optional = true
no_implicit_optional = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"