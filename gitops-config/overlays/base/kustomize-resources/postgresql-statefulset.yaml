---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nexvion-postgresql
  namespace: nexvion
  labels:
    app.kubernetes.io/name: nexvion
    app.kubernetes.io/component: postgresql
    app.kubernetes.io/part-of: nexvion-ecommerce
    app.kubernetes.io/managed-by: argocd
spec:
  serviceName: nexvion-postgresql-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nexvion
      app.kubernetes.io/component: postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexvion
        app.kubernetes.io/component: postgresql
      annotations:
        checksum/config: "postgresql-config-checksum"
    spec:
      containers:
        - name: postgresql
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: nexvion
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nexvion-postgresql-secrets
                  key: postgresql-password
          envFrom:
            - configMapRef:
                name: nexvion-postgresql-config
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: ""
            - name: config
              mountPath: /etc/postgresql
              readOnly: true
      volumeClaimTemplates:
        - metadata:
            name: data
          spec:
            accessModes: ["ReadWriteOnce"]
            storageClassName: gp3
            resources:
              requests:
                storage: 20Gi
