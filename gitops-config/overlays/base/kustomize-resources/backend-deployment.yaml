---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexvion-backend
  labels:
    app.kubernetes.io/name: nexvion
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: nexvion-ecommerce
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: nexvion
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexvion
        app.kubernetes.io/component: backend
      annotations:
        checksum/config: "{{ .Values.backend.configChecksum }}"
        checksum/secrets: "{{ .Values.backend.secretsChecksum }}"
    spec:
      containers:
        - name: backend
          image: nexvion-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: APP_NAME
              value: "Nexvion API"
            - name: APP_VERSION
              value: "0.1.0"
            - name: DEBUG
              value: "false"
            - name: CORS_ORIGINS
              value: '["https://nexvion.ghanshyam.site"]'
          envFrom:
            - secretRef:
                name: nexvion-secrets
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            limits:
              cpu: 1000m
              memory: 512Mi
            requests:
              cpu: 250m
              memory: 256Mi
