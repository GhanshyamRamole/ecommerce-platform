---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexvion-ai-analyzer
  labels:
    app.kubernetes.io/name: nexvion
    app.kubernetes.io/component: ai-analyzer
    app.kubernetes.io/part-of: nexvion-ecommerce
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nexvion
      app.kubernetes.io/component: ai-analyzer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexvion
        app.kubernetes.io/component: ai-analyzer
    spec:
      containers:
        - name: ai-analyzer
          image: nexvion-ai-analyzer:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "analyzer.py"]
          args:
            - "--interval"
            - "15"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: OPENSEARCH_HOST
              value: "opensearch.monitoring.svc.cluster.local"
            - name: OPENSEARCH_PORT
              value: "9200"
            - name: OPENSEARCH_USER
              value: "admin"
            - name: OPENSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nexvion-ai-secrets
                  key: opensearch-password
            - name: OPENSEARCH_SSL
              value: "false"
            - name: OPENSEARCH_VERIFY
              value: "false"
            - name: OPENSEARCH_INDEX
              value: "logs-*"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nexvion-ai-secrets
                  key: openai-api-key
            - name: OPENAI_MODEL
              value: "gpt-4"
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
