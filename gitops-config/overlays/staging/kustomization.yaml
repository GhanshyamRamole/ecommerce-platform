---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base
  - external-secrets/external-secrets.yaml
  - external-secrets/ai-analyzer-secrets.yaml
  - external-secrets/postgresql-secrets.yaml

namespace: nexvion-staging

namePrefix: staging-

images:
  - name: nexvion-frontend
    newTag: "staging-latest"
  - name: nexvion-backend
    newTag: "staging-latest"
  - name: nexvion-ai-analyzer
    newTag: "staging-latest"

configMapGenerator:
  - name: nexvion-config
    behavior: merge
    literals:
      - ENVIRONMENT=staging
      - LOG_LEVEL=info
  - name: nexvion-ingress-config
    behavior: merge
    literals:
      - CERT_ARN=arn:aws:acm:ap-south-1:XXXXXXXXXXXX:certificate/STAGING-CERT-ID
      - HOST=staging-nexvion.ghanshyam.site

replicas:
  - name: nexvion-frontend
    count: 2
  - name: nexvion-backend
    count: 2
  - name: nexvion-ai-analyzer
    count: 1

patchesStrategicMerge:
  - patches/staging-resources.yaml
  - patches/staging-ingress.yaml

replacements:
  - source:
      kind: ConfigMap
      name: nexvion-config
      fieldPath: data.ENVIRONMENT
    targets:
      - select:
          kind: Deployment
        fieldPaths:
          - spec.template.spec.containers.[name=backend].env.[name=ENVIRONMENT].value
          - spec.template.spec.containers.[name=frontend].env.[name=ENVIRONMENT].value
          - spec.template.spec.containers.[name=ai-analyzer].env.[name=ENVIRONMENT].value
