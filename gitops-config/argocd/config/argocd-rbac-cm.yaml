---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: argocd
data:
  policy.default: role:readonly
  policy.csv: |
    # Admin full access
    p, role:admin, applications, *, */*, allow
    p, role:admin, repositories, *, *, allow
    p, role:admin, clusters, *, *, allow
    p, role:admin, projects, *, *, allow
    p, role:admin, certificates, *, *, allow
    p, role:admin, accounts, *, *, allow
    p, role:admin, gpgkeys, *, *, allow

    # Developer access - dev and staging only
    p, role:developer, applications, get, nexvion/nexvion-dev, allow
    p, role:developer, applications, sync, nexvion/nexvion-dev, allow
    p, role:developer, applications, override, nexvion/nexvion-dev, allow
    p, role:developer, applications, get, nexvion/nexvion-staging, allow
    p, role:developer, applications, sync, nexvion/nexvion-staging, allow
    p, role:developer, applications, override, nexvion/nexvion-staging, allow
    p, role:developer, repositories, get, *, allow

    # Read-only access - all environments
    p, role:readonly, applications, get, nexvion/*, allow
    p, role:readonly, repositories, get, *, allow
    p, role:readonly, clusters, get, *, allow

    # CI/CD bot - can update image tags in gitops-config repo
    p, role:ci-bot, repositories, get, *, allow
    p, role:ci-bot, applications, get, nexvion/*, allow

  scopes: '[groups, email, profile]'

  # Group mappings (integrate with your IdP - Dex, Keycloak, Cognito, etc.)
  # Example for Dex:
  #   g, dex:groups:nexvion-admins, role:admin
  #   g, dex:groups:nexvion-developers, role:developer
  #   g, dex:groups:nexvion-viewers, role:readonly
  #   g, dex:groups:nexvion-ci-bot, role:ci-bot
