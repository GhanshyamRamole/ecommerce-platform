---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nexvion-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-options: >
      CreateNamespace=true,PrunePropagationPolicy=foreground
spec:
  project: nexvion
  source:
    repoURL: https://github.com/your-org/ai-ecommerce-devops.git
    targetRevision: develop
    path: gitops-config/overlays/dev
    kustomize:
      version: v5.4.0
  destination:
    server: https://kubernetes.default.svc
    namespace: nexvion-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: autoscaling
      kind: HorizontalPodAutoscaler
      jsonPointers:
        - /spec/minReplicas
    - group: ""
      kind: Secret
      jsonPointers:
        - /data
  revisionHistoryLimit: 10
