---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-options: >
      CreateNamespace=true,PrunePropagationPolicy=foreground
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/ecommerce-platform.git
    targetRevision: main
    path: observability-infra/helm/monitoring
    helm:
      version: v3.12.0
      valueFiles:
        - values.yaml
      parameters:
        - name: global.clusterName
          value: "nexvion"
        - name: global.region
          value: "ap-south-1"
        - name: grafana.adminPassword
          value: "$GRAFANA_ADMIN_PASSWORD"
        - name: alertmanager.config.receivers[0].slackConfigs[0].api_url
          value: "$SLACK_WEBHOOK_URL"
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
