# Logging Stack Values (Loki + Promtail)
# Deploy: helm upgrade --install logging ./observability-infra/helm/logging -n monitoring --create-namespace -f values.yaml

# Loki configuration
loki:
  enabled: true
  auth_enabled: false

  # Loki configuration
  loki:
    serviceAccount:
      create: true
      name: loki
      annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/LokiS3AccessRole
    config:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      schemaConfig:
        configs:
          - from: 2024-01-01
            store: boltdb-shipper
            object_store: s3
            schema: v12
            index:
              prefix: index_
              period: 24h
      limits_config:
        reject_old_samples: true
        reject_old_samples_max_age: 168h
        ingestion_rate_mb: 20
        ingestion_burst_size_mb: 30
        per_stream_rate_limit: 10MB
        per_stream_rate_limit_burst: 20MB
      storage_config:
        boltdb_shipper:
          active_index_directory: /data/loki/boltdb-shipper-active
          cache_location: /data/loki/boltdb-shipper-cache
          cache_ttl: 24h
          shared_store: s3
        s3:
          bucketnames: "nexvion-loki-logs"
          endpoint: "s3.ap-south-1.amazonaws.com"
          region: "ap-south-1"
          s3forcepathstyle: false
          # Use IRSA for authentication - no access_key_id/secret_access_key needed
        filesystem:
          directory: /data/loki/chunks
    # Resources
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 4Gi
    # Persistence (for boltdb cache)
    persistence:
      enabled: true
      storageClassName: gp3
      size: 20Gi
    # Service
    service:
      type: ClusterIP
      port: 3100
    # Ingress (optional - for querying from outside)
    ingress:
      enabled: false
    # Replication
    replication_factor: 1
    # Query frontend
    queryFrontend:
      replicas: 2
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
    # Querier
    querier:
      replicas: 2
      resources:
        requests:
          cpu: 200m
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 1Gi
    # Index gateway
    indexGateway:
      replicas: 2
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
    # Compactor
    compactor:
      enabled: true
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
    # Distributor
    distributor:
      replicas: 2
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
    # Ingester
    ingester:
      replicas: 2
      resources:
        requests:
          cpu: 200m
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 1Gi

  # Promtail configuration
  promtail:
    enabled: true
    config:
      clients:
        - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push
      positions:
        path: /var/log/positions.yaml
      scrape_configs:
        - job_name: kubernetes-pods
          kubernetes_sd_configs:
            - role: pod
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
              target_label: app
            - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
              target_label: component
            - source_labels: [__meta_kubernetes_pod_name]
              target_label: pod
            - source_labels: [__meta_kubernetes_namespace]
              target_label: namespace
            - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_managed_by]
              target_label: managed_by
            - action: keep
              regex: .+
              source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        - job_name: kubernetes-nodes
          kubernetes_sd_configs:
            - role: node
          relabel_configs:
            - source_labels: [__address__]
              target_label: __address__
              replacement: '$(NODE_NAME):9100'
            - source_labels: [__meta_kubernetes_node_name]
              target_label: node
            - action: labelmap
              regex: __meta_kubernetes_node_label_(.+)
        - job_name: kubernetes-services
          kubernetes_sd_configs:
            - role: service
          relabel_configs:
            - source_labels: [__meta_kubernetes_service_name]
              target_label: service
            - source_labels: [__meta_kubernetes_namespace]
              target_label: namespace
            - action: keep
              regex: .+
              source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
    # Resources
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    # Service account
    serviceAccount:
      create: true
      name: promtail
    # RBAC
    rbac:
      create: true
    # Extra volumes for log paths
    extraVolumes:
      - name: varlog
        hostPath:
          path: /var/log
      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers
    extraVolumeMounts:
      - name: varlog
        mountPath: /var/log
        readOnly: true
      - name: varlibdockercontainers
        mountPath: /var/lib/docker/containers
        readOnly: true
    # Security context
    securityContext:
      runAsUser: 0
      runAsGroup: 0
      privileged: true