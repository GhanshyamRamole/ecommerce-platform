apiVersion: v2
name: monitoring
description: Prometheus + Grafana + Alertmanager + Node Exporter + kube-state-metrics
type: application
version: 1.0.0
appVersion: "1.0.0"
dependencies:
  - name: kube-prometheus-stack
    version: "55.0.0"
    repository: "https://prometheus-community.github.io/helm-charts"
  - name: node-exporter
    version: "4.0.0"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: nodeExporter.enabled
  - name: kube-state-metrics
    version: "5.0.0"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: kubeStateMetrics.enabled

maintainers:
  - name: DevOps Team
    email: devops@example.com